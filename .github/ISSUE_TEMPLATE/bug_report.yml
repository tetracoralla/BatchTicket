name: Bug report
description: Report a reproducible BatchTicket defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private data, or unredacted datasets. Security reports belong in GitHub's private vulnerability reporting flow described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.2.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Python library
        - CLI
        - MCP server
        - Codex plugin
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command or plan after removing sensitive data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the stable error code and a redacted response when available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and host version when relevant.
    validations:
      required: true
