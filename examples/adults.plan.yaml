version: "1"
sources:
  users:
    path: ./users.json
    select: data.users[*]
steps:
  - id: adults
    op: filter
    source: users
    where: {field: age, gte: 18}
  - id: shaped
    op: select
    fields:
      - {field: userId, as: id}
      - {field: profile.name, as: name}
      - {field: profile.country, as: country}
assert:
  - {id: id_required, type: not_null, field: id}
  - {id: id_unique, type: unique, field: id}
return:
  mode: auto
  sample_rows: 5
  max_inline_bytes: 10000

