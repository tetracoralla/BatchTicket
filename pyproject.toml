[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-data-transformer"
version = "0.2.0"
description = "Deterministic, token-aware structured-data transformation runtime for agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3,<2",
  "jsonschema>=4.23,<5",
  "mcp>=1.12,<2",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.16,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
adt = "data_transformer.cli:main"
adt-mcp = "data_transformer.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_transformer"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "data_transformer/schemas"

[tool.hatch.build.targets.sdist]
exclude = [".coverage*", "probe_users.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
